{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask NextGenAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.20), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.20), transparent 35%),
                #061326;
            color: #fff;
            overflow: hidden;
        }

        .background-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(245, 185, 66, 0.12);
            filter: blur(100px);
            top: -150px;
            left: -150px;
            pointer-events: none;
        }

        .background-glow.two {
            background: rgba(200, 135, 40, 0.12);
            top: auto;
            left: auto;
            right: -150px;
            bottom: -150px;
        }

        .chat-window {
            position: fixed;
            width: min(440px, calc(100% - 30px));
            height: min(680px, calc(100vh - 40px));
            right: 25px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            background: rgba(9, 25, 47, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            overflow: hidden;
            animation: chatOpen 0.45s ease;
        }

        @keyframes chatOpen {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-header {
            min-height: 82px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(245, 185, 66, 0.24), rgba(200, 135, 40, 0.22));
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .assistant-info { display: flex; align-items: center; gap: 12px; }

        .ai-avatar {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #f5b942, #c88728);
            font-size: 25px;
            box-shadow: 0 0 25px rgba(245, 185, 66, 0.35);
        }

        .assistant-name {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
        }

        .assistant-status {
            margin: 3px 0 0;
            font-size: 12px;
            color: #9ca3af;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 5px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .header-buttons { display: flex; gap: 7px; }

        .header-btn {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #dbeafe;
            transition: 0.25s;
            cursor: pointer;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar { width: 5px; }
        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        .welcome-card {
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(245, 185, 66, 0.15), rgba(200, 135, 40, 0.12));
            border: 1px solid rgba(96, 165, 250, 0.12);
        }

        .welcome-card h4 { font-size: 17px; margin-bottom: 8px; }

        .welcome-card p {
            font-size: 13px;
            line-height: 1.6;
            color: #b8c1d9;
            margin-bottom: 0;
        }

        .message-row {
            display: flex;
            margin-bottom: 15px;
        }

        .message-row.user { justify-content: flex-end; }

        .message {
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 17px;
            font-size: 14px;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .message.ai {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-left-radius: 5px;
            color: #e5e7eb;
        }

        .message.user {
            background: linear-gradient(135deg, #f5b942, #c88728);
            border-bottom-right-radius: 5px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(245, 185, 66, 0.25);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 10px;
            max-width: 200px;
            padding: 12px 14px;
            border-radius: 18px 18px 18px 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.12), inset 0 1px 0 rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .typing-indicator.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            display: none;
        }

        .typing-avatar {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: linear-gradient(135deg, #f5b942, #c88728);
            box-shadow: 0 0 18px rgba(245, 185, 66, 0.45);
            font-size: 14px;
            flex-shrink: 0;
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 54px;
            height: 20px;
            padding: 2px 6px;
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.08);
        }

        .typing-dot {
            display: inline-block;
            font-size: 22px;
            line-height: 1;
            color: rgba(255, 224, 154, 0.96);
            text-shadow: 0 0 10px rgba(245, 185, 66, 0.7);
            animation: typingBlink 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBlink {
            0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        .chat-footer {
            padding: 16px 16px 18px;
            background: rgba(6, 19, 38, 0.94);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(11, 29, 53, 0.82);
            color: #f8fafc;
            border-radius: 14px;
            padding: 12px 14px;
            outline: none;
        }

        .chat-input::placeholder { color: rgba(148, 163, 184, 0.8); }

        .chat-send {
            border: none;
            border-radius: 14px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #f5b942, #c88728);
            color: white;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(245, 185, 66, 0.28);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .chat-send:hover { transform: translateY(-1px); }
        .chat-send:disabled { opacity: 0.7; cursor: not-allowed; }

        @media (max-width: 576px) {
            .chat-window {
                width: min(100% - 18px, 440px);
                right: 9px;
                bottom: 9px;
                height: min(80vh, 650px);
                border-radius: 20px;
            }

            .chat-body { padding: 14px; }
            .message { max-width: 88%; }
            .chat-form { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow two"></div>

    <div class="chat-window" role="dialog" aria-label="Chatbot conversation">
        <div class="chat-header">
            <div class="assistant-info">
                <div class="ai-avatar">🤖</div>
                <div>
                    <p class="assistant-name">NextGenAI Assistant</p>
                    <p class="assistant-status"><span class="online-dot"></span>Online</p>
                </div>
            </div>
            <div class="header-buttons">
                <button class="header-btn" type="button" aria-label="Minimize chatbot"><i class="bi bi-dash-lg"></i></button>
                <button class="header-btn" type="button" aria-label="Close chatbot"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <div id="chatMessages" class="chat-body">
            <div class="welcome-card">
                <h4>👋 Hi! I'm NextGenAI Assistant</h4>
                <p>Ask me about AI, coding, projects, learning roadmaps or our club.</p>
            </div>

            <div id="typingIndicator" class="typing-indicator hidden" aria-live="polite" aria-label="Assistant is typing">
                <div class="typing-avatar">🤖</div>
                <div class="typing-bubble">
                    <span class="typing-dot">•</span>
                    <span class="typing-dot">•</span>
                    <span class="typing-dot">•</span>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <form id="chatForm" class="chat-form" method="post">
                {% csrf_token %}
                <input id="chatInput" class="chat-input" type="text" autocomplete="off" placeholder="Ask NextGenAI..." required>
                <button id="sendButton" class="chat-send" type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        (function () {
            if (window.nextGenAiChatInitialized) {
                return;
            }
            window.nextGenAiChatInitialized = true;

            const form = document.getElementById("chatForm");
            const input = document.getElementById("chatInput");
            const messages = document.getElementById("chatMessages");
            const sendButton = document.getElementById("sendButton");
            const typingIndicator = document.getElementById("typingIndicator");

            if (!form || !input || !messages || !sendButton || !typingIndicator) {
                return;
            }

            function scrollToBottom() {
                messages.scrollTop = messages.scrollHeight;
            }

            function showTypingIndicator() {
                typingIndicator.classList.remove("hidden");
                scrollToBottom();
            }

            function hideTypingIndicator() {
                typingIndicator.classList.add("hidden");
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                const message = input.value.trim();
                if (!message) {
                    return;
                }

                const userRow = document.createElement("div");
                userRow.className = "message-row user";
                userRow.innerHTML = '<div class="message user">' + message + '</div>';
                messages.appendChild(userRow);

                input.value = "";
                input.disabled = true;
                sendButton.disabled = true;
                sendButton.textContent = "Sending...";
                showTypingIndicator();

                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

                try {
                    const response = await fetch("{% url 'chatbot:chat' %}", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded",
                            "X-CSRFToken": csrfToken
                        },
                        body: new URLSearchParams({ message: message })
                    });

                    const data = await response.json();

                    if (data.success) {
                        const aiRow = document.createElement("div");
                        aiRow.className = "message-row";
                        aiRow.innerHTML = '<div class="message ai">🤖 ' + data.message + '</div>';
                        messages.appendChild(aiRow);
                    } else {
                        const errorRow = document.createElement("div");
                        errorRow.className = "message-row";
                        errorRow.innerHTML = '<div class="message ai">⚠️ ' + (data.error || "Something went wrong.") + '</div>';
                        messages.appendChild(errorRow);
                    }
                } catch (error) {
                    const errorRow = document.createElement("div");
                    errorRow.className = "message-row";
                    errorRow.innerHTML = '<div class="message ai">⚠️ Something went wrong. Please try again.</div>';
                    messages.appendChild(errorRow);
                    console.error(error);
                } finally {
                    hideTypingIndicator();
                    input.disabled = false;
                    sendButton.disabled = false;
                    sendButton.textContent = "Send";
                    input.focus();
                    scrollToBottom();
                }
            });
        })();
    </script>
</body>
</html>
