
{% extends "base.html" %}

{% load management_filters %}
{% block title %}
{{ title }}
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-4">
                        {{ title }}
                    </h2>


                    <form method="POST">

                        {% csrf_token %}


                        {% for field in fields %}

                            <div class="mb-3">

                                <label
                                    class="form-label fw-semibold"
                                    for="id_{{ field }}"
                                >
                                    {{ field|title }}
                                </label>


                                {% if field == "description" or field == "bio" %}

                                    <textarea
                                        name="{{ field }}"
                                        id="id_{{ field }}"
                                        class="form-control"
                                        rows="5"
                                    >{{ item|get_item:field }}</textarea>


                                {% else %}

                                    <input
                                        type="text"
                                        name="{{ field }}"
                                        id="id_{{ field }}"
                                        value="{{ item|get_item:field }}"
                                        class="form-control"
                                    >

                                {% endif %}

                            </div>

                        {% endfor %}


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Save
                            </button>

                            <a
                                href="javascript:history.back()"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
